<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<meta name="description" content="תודה שפניתם ל-Lucky Roll13. הפרטים התקבלו וניצור איתכם קשר בהקדם.">
<link rel="icon" href="/assets/logo.png">

<title>תודה שהשארתם פרטים | Lucky Roll13</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #07110f;
}

body {
  min-height: 100vh;
  background:
    url('/thank-you-luckyroll13.webp')
    center center / cover
    no-repeat;
}

/* אזור לחיץ שקוף מעל "חזרה לאתר" שבתמונה */
.back-link {
  position: fixed;
  z-index: 10;

  left: 50%;
  top: 69%;

  transform: translate(-50%, -50%);

  width: min(430px, 29vw);
  height: 105px;

  display: block;

  background: transparent;
  border: 0;

  cursor: pointer;
}

.back-link:focus-visible {
  outline: 4px solid #00aeea;
  outline-offset: 6px;
  border-radius: 14px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* התאמה לטלפון */
@media (max-width: 700px) {
  body {
    background-position: center top;
  }

  .back-link {
    top: 69%;
    width: 56vw;
    height: 70px;
  }
}
</style>

  <script defer src="/assets/tracking.js"></script>
  <link rel="preload" as="image" href="/thank-you-luckyroll13.webp">
</head>

<body>

<main id="main">
  <h1 class="sr-only">תודה שהשארתם פרטים</h1>
  <p class="sr-only">קיבלנו את הפרטים וניצור איתכם קשר בהקדם.</p>
  <a
    class="back-link"
    href="/"
    aria-label="חזרה לאתר Lucky Roll13"
  ></a>
</main>

</body>
</html>
